[project]
name = "opjax"
version = "0.1.0"
description = "Operator-from-Scratch in JAX: GUI-agent training playground."
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic==0.97.0",
    "chex==0.1.90",
    "dialog",
    "gemma",
    "huggingface-hub==0.36.2",
    "jaxtyping==0.3.9",
    "modal==1.4.2",
    "orbax-checkpoint==0.11.39",
    "pillow==12.2.0",
    "pyarrow==24.0.0",
    "qwix>=0.1.6",
    "tomli==2.2.1",
    "wandb==0.26.1",
]

[project.scripts]
opjax = "opjax.cli:main"
opjax-model-factory = "opjax.model_factory.cli:main"
opjax-pallas = "opjax.pallas.cli:main"
opjax-pallas-eval = "opjax.pallas.evaluation_cli:main"
opjax-pallas-train = "opjax.pallas.training:main"
opjax-pallas-g4-diagnostic = "opjax.pallas.gate4_diagnostics:main"
opjax-pallas-environment-corpus = "opjax.pallas.environment_corpus:main"
opjax-pallas-environment-runner = "opjax.pallas.environment_runner:main"
opjax-pallas-candidate-worker = "opjax.pallas.candidate_worker:main"
opjax-pallas-phase2-benchmark = "opjax.pallas.phase2_benchmark:main"
opjax-pallas-phase2-runner = "opjax.pallas.phase2_runner:main"
opjax-pallas-phase2-worker = "opjax.pallas.phase2_worker:main"
opjax-jaxbench-capability = "opjax.pallas.jaxbench_capability:main"
opjax-pallas-environment-sample = "opjax.pallas.environment_sampling:main"
opjax-pallas-g42-agent = "opjax.pallas.g42_agent:main"
opjax-pallas-g42-admission = "opjax.pallas.g42_admission:main"
opjax-pallas-g42-curriculum = "opjax.pallas.g42_curriculum:main"
opjax-pallas-g42-experiment = "opjax.pallas.g42_experiment:main"
opjax-pallas-g42-traces = "opjax.pallas.g42_traces:main"
opjax-pallas-g42-train = "opjax.pallas.g42_training:main"
opjax-pallas-g42-verifier = "opjax.pallas.g42_verifier:main"
opjax-pallas-g6-remote = "opjax.pallas.g6_remote:main"
opjax-pallas-g6-train = "opjax.pallas.g6_training:main"
opjax-pallas-g6-experiment = "opjax.pallas.g6_experiment:main"
opjax-pallas-g43-corpus = "opjax.pallas.g43_corpus:main"
opjax-pallas-g43-experiment = "opjax.pallas.g43_experiment:main"
opjax-pallas-g43-sample = "opjax.pallas.g43_sampling:main"
opjax-pallas-g43-train = "opjax.pallas.g43_training:main"
opjax-pallas-g5-corpus = "opjax.pallas.g5_corpus:main"
opjax-pallas-g5-train = "opjax.pallas.g5_training:main"
opjax-pallas-g5-experiment = "opjax.pallas.g5_experiment:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
]
tinker = [
    "litellm==1.75.5.post2",
    "mini-swe-agent==2.4.6",
    "tinker==0.24.0",
    "tinker-cookbook[inkling]==0.5.3",
]
tpu = [
    "google-tunix",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
google-tunix = { path = "references/tunix", editable = true }
gemma = { git = "https://github.com/google-deepmind/gemma.git" }
dialog = { git = "https://github.com/google-deepmind/dialog.git" }

[tool.uv]
default-groups = ["dev", "tpu"]
conflicts = [
    [
        { group = "tinker" },
        { group = "tpu" },
    ],
]
